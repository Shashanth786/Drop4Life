<!DOCTYPE html>
<html lang="en">
 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Drop4Life Sign Up</title>

    <!-- Navbar CSS -->
    <link rel="stylesheet" href="CSS/navbar.css">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

    <style>

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #ffebee, #ffffff);
        }

        .signup-card {
            max-width: 450px;
            width: 100%;
            border: none;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .15);
        }

        .logo {
            font-size: 35px;
            color: #dc3545;
        }

        .form-control,
        .form-select {
            border-radius: 10px;
            padding: 10px;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #dc3545;
            box-shadow: 0 0 0 .15rem rgba(220, 53, 69, .2);
        }

        .btn-danger {
            border-radius: 10px;
        }

    </style>

    <link rel="stylesheet" href="CSS/responsive.css">
    <script src="JS/mobile-nav.js" defer></script>
</head>

<body>

 

    <!-- =========================
         NAVBAR
    ========================== -->

    <nav class="drop-navbar">

        <!-- Logo -->
        <div class="drop-logo">
            <i class="fa-solid fa-droplet"></i>
            <span>
                DROP<span class="drop-four">4</span>LIFE
            </span>
        </div>

        <!-- Nav Links -->
        <ul class="drop-nav-links">

            <li>
                <a href="index.html">
                    <i class="fa-solid fa-house"></i>
                    HOME
                </a>
            </li>

            <li>
                <a href="HTML/about.html">
                    <i class="fa-solid fa-circle-info"></i>
                    ABOUT US
                </a>
            </li>

            <li>
                <a href="HTML/donationprocess.html">
                    <i class="fa-solid fa-stethoscope"></i>
                    BLOOD DONATION PROCESS
                </a>
            </li>

            <li>
                <a href="HTML/contact.html">
                    <i class="fa-solid fa-phone"></i>
                    CONTACT US
                </a>
            </li>

        </ul>

        <!-- Right Side -->
        <div class="drop-nav-right">

            <a href="login.html">
                <button class="drop-login-btn">
                    <b>Login</b>
                </button>
            </a>

            <a href="signup.html">
                <button class="drop-signup-btn">
                    <b>Sign Up</b>
                </button>
            </a>

        </div>

    </nav>


    <!-- =========================
         SIGNUP CARD
    ========================== -->

    <div class="container d-flex justify-content-center align-items-center min-vh-100">

        <div class="card signup-card p-4">

            <!-- Logo -->

            <div class="text-center mb-3">

                <div class="logo">

                    <i class="fa-solid fa-droplet"></i>

                    <span style="color: black;">
                        Drop
                    </span>

                    <span style="color: #dc3545;">
                        4
                    </span>

                    <span style="color: black;">
                        Life
                    </span>

                </div>

                <small class="text-muted">
                    <b>Create Account</b>
                </small>

            </div>


            <!-- =========================
                 SIGNUP FORM
            ========================== -->

      <div id="accountError"
     style="color: red; text-align: center; margin: 15px; font-weight: bold;">
     </div>
   

            <form id="signupForm" action="register" method="post">
                  
                  


                <!-- Full Name -->

                <div class="mb-2">

                    <input
                        type="text"
                        id="fullName"
                        name="fullName"
                        class="form-control"
                        placeholder="Full Name"
                        required>

                </div>


                <!-- Email -->

                <div class="mb-2">

                    <input
                        type="email"
                        id="email"
                        name="email"
                        class="form-control"
                        placeholder="Email Address"
                        required>

                </div>


                <!-- Mobile -->

                <div class="mb-2">

                    <input
                        type="tel"
                        id="mobile"
                        name="phone"
                         maxlength="10"
                         minlength="10"
                        pattern="[0-9]{10}"
                        class="form-control"
                        placeholder="Mobile Number"
                        required>

                </div>


                <!-- Blood Group -->

                <div class="mb-2">

                    <select
                        id="bloodGroup"
                        name="bloodGroup"
                        class="form-select"
                        required>

                        <option value="" selected disabled>
                            Blood Group
                        </option>

                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>

                    </select>

                </div>


                <!-- Password -->

                <div class="mb-2">

                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="form-control"
                        placeholder="Password"
                        required>

                </div>


                <!-- Confirm Password -->

                <div class="mb-3">

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        class="form-control"
                        placeholder="Confirm Password"
                        required>

                </div>


                <!-- Create Account -->

                <div class="d-grid">

                    <button
                        type="submit"
                        class="btn btn-danger">

                        Create Account

                    </button>

                </div>


                <!-- Login -->

                <div class="text-center mt-3">

                    Already have an account?

                    <a
                        href="login.html"
                        class="text-danger text-decoration-none fw-semibold">

                        Login

                    </a>

                </div>

            </form>

        </div>

    </div>


    <!-- Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">
    </script>


 <script>
 const params = new URLSearchParams(window.location.search);
 const error = params.get("error");

 if (error === "exists") {
     document.getElementById("accountError").innerHTML =
         "Account already exists. Please login.";
 }

 if (error === "password") {
     document.getElementById("accountError").innerHTML =
         "Passwords do not match.";
 }
</script>
  

</body>

</html>
